name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug
      # Hermetic JVM/Robolectric tests: no live streams or Radio Browser calls, so CI never depends on stream uptime.
      # Instrumented tests (connectedCarDebugAndroidTest) need an emulator and are run locally only.
      - run: ./gradlew testCarDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/testCarDebugUnitTest/
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-radio-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
