[versions]
agp = "8.5.2"
kotlin = "2.0.20"
media3 = "1.4.1"
composeBom = "2024.09.03"
activityCompose = "1.9.2"
coreKtx = "1.13.1"
guavaCoroutines = "1.8.1"
lifecycle = "2.8.6"
coil = "2.7.0"
documentfile = "1.0.1"
androidxMedia = "1.7.0"
# --- test-only ---
junit = "4.13.2"
robolectric = "4.13"
truth = "1.4.4"
androidxTestCore = "1.6.1"
androidxTestExtJunit = "1.2.1"
androidxTestRunner = "1.6.2"
androidxTestRules = "1.6.1"
uiautomator = "2.3.0"
mockwebserver = "4.12.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-icons-core = { module = "androidx.compose.material:material-icons-core" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
androidx-media = { module = "androidx.media:media", version.ref = "androidxMedia" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
kotlinx-coroutines-guava = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-guava", version.ref = "guavaCoroutines" }
# --- test-only ---
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
media3-test-utils = { module = "androidx.media3:media3-test-utils", version.ref = "media3" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
